name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false  # report every platform, not just the first failure
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff>=0.16"
      - run: ruff check flicks tests scripts
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build   # type-checks first
  system-one-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Offline smoke of the full teacher -> tags -> Laya export -> student path (lexical stand-in).
      - run: python -m flicks.tagging --out work/tags.json
      - run: python -m flicks.distill --tags work/tags.json --export-laya work/laya-data --student work/student.json
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The wheel must carry the catalogue and the built frontend, and the console script must start.
      - run: npm --prefix web ci && npm --prefix web run build
      - run: python -m pip install .
      - run: flicks --help
      - run: |
          cd /tmp && python - <<'PY'
          from flicks.config import DEFAULT_CATALOG, DEFAULT_STATIC
          assert DEFAULT_CATALOG.is_file()
          for name in ('index.html', 'couch.html', 'manifest.webmanifest', 'icon-512.png'):
              assert (DEFAULT_STATIC/name).is_file(), name
          assert any((DEFAULT_STATIC/'assets').glob('*.js')), 'no built JavaScript'
          PY
  audio-decoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The tested lockfile, so a new upstream release cannot break CI without a code change.
      - run: python -m pip install -r requirements-voice-tested.txt -e ".[dev]"
      - run: python -m pytest tests/test_voice.py
