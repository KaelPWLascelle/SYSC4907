name: Flicks tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false  # report every platform, not just the first failure
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff>=0.16"
      - run: ruff check flicks tests scripts
  voice-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/voice-ui.test.mjs tests/student.test.mjs tests/couch-ui.test.mjs
  system-one-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Offline smoke of the full teacher -> tags -> Laya export -> student path (lexical stand-in).
      - run: python -m flicks.tagging --out work/tags.json
      - run: python -m flicks.distill --tags work/tags.json --export-laya work/laya-data --student work/student.json
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The wheel must carry the catalogue and every static page, and the console script must start.
      - run: python -m pip install .
      - run: flicks --help
      - run: cd /tmp && python -c "from flicks.__main__ import ROOT; assert all((ROOT/p).is_file() for p in ('data/movies.json', 'static/index.html', 'static/couch.html', 'static/couch.js', 'static/couch-host.js', 'static/poster.js'))"
  audio-decoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tested lockfile, so a new upstream release cannot break CI without a code change.
      - run: python -m pip install -r requirements-voice-tested.txt -e ".[dev]"
      - run: python -m pytest tests/test_voice.py
