name: Release
# Push a tag such as v0.5.0 to publish a release whose wheel carries the built interface, so users
# install Flicks with pipx and need neither Node nor a clone (docs/adr/0020-packaging.md).
on:
  push:
    tags: ['v*']
permissions:
  contents: write  # create the release and upload its files
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm --prefix web ci && npm --prefix web run build
      - run: python -m pip install build
      - run: python -m build
      # The tag must match the package version, and the wheel must carry the interface and start.
      - run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
          python -m zipfile -l dist/*.whl | grep -q 'flicks/static/index.html'
          python -m pip install dist/*.whl
          cd /tmp && flicks setup --check
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Flicks $GITHUB_REF_NAME" --generate-notes
