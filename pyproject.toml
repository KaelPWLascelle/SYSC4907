[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flicks"
version = "0.3.0"
description = "Local-first recommendation experiment for SYSC 4907"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
voice = ["faster-whisper==1.2.1"]

[project.scripts]
flicks = "flicks.__main__:main"

[tool.setuptools]
packages = ["flicks"]

[tool.setuptools.package-data]
flicks = ["data/*.json", "static/*.html", "static/*.js", "static/*.css"]

[tool.ruff]
line-length = 120
